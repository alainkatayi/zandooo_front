<a href="#" class="block bg-white rounded-xl  hover:shadow-xl transition duration-300 overflow-hidden">
    <div class="h-30 bg-gray-900 w-full relative rounded-b-xl">
            <img [src]="product.image" alt="Image de l'article" class="h-full w-full object-cover" />
        <span
            class="absolute top-2 right-2 bg-teal-600 text-white text-xs font-semibold px-2 py-1 rounded-full">New</span>
    </div>
    <div class="p-4">
        <h3 class="text-xl font-semibold text-gray-900 truncate">  {{ product.name }} </h3>
        <p class="text-sm text-gray-500 mt-1">Fresh organic goods & produce</p>

        <div class="flex items-center justify-between mt-3 text-sm">
            <div class="flex items-center text-yellow-500">
                <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.015 8.72c-.783-.57-.381-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                    </path>
                </svg>
                <span class="text-gray-700"> {{ product.shop.name }} </span>
            </div>

            <p class="text-gray-700"><span class="font-semibold text-teal-600">$ {{ product.price }} </span></p>
        </div>
    </div>
</a>
