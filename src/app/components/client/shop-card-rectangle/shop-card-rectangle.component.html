<a href="#" class="block bg-white rounded-xl hover:shadow-xl transition duration-300 overflow-hidden border border-gray-100">
    <!-- Section Image -->
    <div class="h-30 bg-gray-900 w-full relative">
        <img [src]="shop.logo" alt="Logo de la boutique" class="h-full w-full object-cover" />
    </div>

    <!-- Section Infos -->
    <div class="p-4">
        <!-- Nom de la boutique -->
        <h3 class="text-lg font-bold text-gray-900 truncate mb-2">
            {{ shop.name }}
        </h3>

        <!-- Horaires : Agencement horizontal optimisé -->
        <div class="flex items-center justify-between text-xs py-2 px-3 bg-gray-50 rounded-lg border border-gray-100">
            <!-- Ouverture -->
            <div class="flex flex-col">
                <span class="text-[10px] text-gray-400 uppercase font-semibold">Ouvert</span>
                <div class="flex items-center text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="font-medium">{{ shop.opening_hours }}</span>
                </div>
            </div>

            <!-- Petit séparateur fléché -->
            <div class="text-gray-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>

            <!-- Fermeture -->
            <div class="flex flex-col items-end">
                <span class="text-[10px] text-gray-400 uppercase font-semibold">Fermé</span>
                <div class="flex items-center text-gray-700">
                    <span class="font-medium">{{ shop.closing_hours }}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 ml-1 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>
</a>
